<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAIN | Seokwon</title>

  <link rel="stylesheet" href="/CSS/style.css"> <!-- for css file link -->
</head>

<body class="home-page">


  <header>
  <nav>
  <a href="../index.html">MAIN</a>
  <a href="/PROJECTS">PROJECTS</a>
  <a href="/ABOUT">ABOUT</a>
  </nav>

</header>


<main style="position: relative;">
  <canvas id="gpuCanvas" width="600" height="250"></canvas>

  <canvas id="textPreview" width="2200" height="900"
          style="position: absolute; top: 50%; left: 50%;
                 transform: translate(-50%, -50%);
                 max-width: 100%; pointer-events: none;">
  </canvas>
</main>


  

<footer>
    <p>© 2026 Seokwon Hong</p>
  </footer>

    <!-- Transition animation-->
<script>
  window.addEventListener("DOMContentLoaded", () => {
    document.body.classList.add("page-loaded");
  });

  document.querySelectorAll("nav a").forEach(link => {
    link.addEventListener("click", function (event) {
      event.preventDefault();

      const destination = this.href;

      document.body.classList.remove("page-loaded");
      document.body.classList.add("fade-out");

      setTimeout(() => {
        window.location.href = destination;
      }, 200);
    });
  });
</script>

<script type="module">
  import { drawText } from "./JS/imageMap.js";

  const canvas = document.querySelector("#textPreview");
  const phrases = [
    { text: "Hello!", duration: 2500 },
    { text: "I'm Seokwon", duration: 3000 },
    { text: "Thanks for visiting", duration: 3500 },
  ];

  let index = 0;

  function showNextPhrase() {
    const phrase = phrases[index];
    let visibleLength = 0;

    function typeNextLetter() {
        visibleLength++;
       drawText(canvas, phrase.text, visibleLength);

        if (visibleLength < phrase.text.length) {
            setTimeout(typeNextLetter, 120);
            return;
        }

        index = (index + 1) % phrases.length;
        setTimeout(showNextPhrase, phrase.duration);
    }

    typeNextLetter();
}

  showNextPhrase();
</script>


<script type="module" src="./JS/main.js"></script>
</body>

</html>
